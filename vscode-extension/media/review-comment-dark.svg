<!-- Gutter marker for an anchored review comment. Same family as the
     panel's inline icons (16px box, 1.5 stroke, round joins, no fill) so
     the editor gutter and the panel read as one tool rather than two.
     Two files because a gutter icon is a real asset, not a themed
     element: it cannot reference --vscode-* colours, so the contrast has
     to be baked per theme. Colour is the panel's --accent, which means
     the same thing in both places: this is anchored, you can click it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16"
     fill="none" stroke="#4daafc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M3.4 2.6H12.6A1.4 1.4 0 0 1 14 4V9.2A1.4 1.4 0 0 1 12.6 10.6H6.6L3.6 13.2V10.6H3.4A1.4 1.4 0 0 1 2 9.2V4A1.4 1.4 0 0 1 3.4 2.6Z" />
</svg>
